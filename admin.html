<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Mosaic Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg:#0e0d0b; --surface:#161512; --border:#2a2720;
    --text:#e8e0d0; --muted:#6b6456; --accent:#c8a96e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace;
         min-height:100vh; display:flex; justify-content:center; padding:38px 20px; }
  main { width:100%; max-width:680px; }
  h1 { font-family:'DM Serif Display',serif; font-weight:400; font-size:28px; }
  .sub { color:var(--muted); font-size:12px; margin:4px 0 24px; }
  .sub a { color:var(--accent); text-decoration:none; }

  .tabs { display:flex; gap:8px; margin-bottom:24px; }
  .tabs button { flex:0 0 auto; padding:9px 18px; background:var(--surface);
    border:1px solid var(--border); color:var(--muted); border-radius:3px;
    font-family:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .tabs button.active { color:var(--accent); border-color:var(--accent); background:#1d1b16; }

  .panel { display:none; }
  .panel.on { display:block; }

  form { display:flex; flex-direction:column; gap:20px; }
  label.field { display:flex; flex-direction:column; gap:7px; }
  .lbl { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .hint { color:var(--muted); }

  input[type=text], input[type=url], input[type=datetime-local], textarea, input[type=file] {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:inherit; font-size:13px; padding:10px 12px; border-radius:3px; width:100%; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { resize:vertical; min-height:64px; line-height:1.5; }
  input[type=file] { padding:9px; cursor:pointer; }
  input[type=file]::file-selector-button { background:var(--border); color:var(--text);
    border:none; font-family:inherit; font-size:12px; padding:6px 11px; border-radius:2px;
    margin-right:11px; cursor:pointer; }

  .seg { display:flex; gap:8px; }
  .seg label { flex:1; text-align:center; padding:10px 6px; border-radius:3px;
    border:1px solid var(--border); background:var(--surface); font-size:12px; cursor:pointer; }
  .seg input { display:none; }
  .seg label:has(input:checked) { border-color:var(--accent); background:#1d1b16; color:var(--accent); }

  .field.typed, .field.srcd { display:none; }
  .field.typed.on, .field.srcd.on { display:flex; }

  .row { display:flex; align-items:center; gap:10px; }
  .check { display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted); cursor:pointer; }
  .check input { width:15px; height:15px; accent-color:var(--accent); }

  button.primary { background:var(--accent); color:#0e0d0b; border:none; font-family:inherit;
    font-size:13px; letter-spacing:.1em; text-transform:uppercase; padding:13px; border-radius:3px;
    cursor:pointer; }
  button.primary:hover { filter:brightness(1.08); }
  button.primary:disabled { opacity:.5; cursor:default; }

  .result { font-size:12px; line-height:1.6; border-radius:3px; padding:12px 14px; display:none; margin-top:4px; }
  .result.show { display:block; }
  .result.ok { background:#15201550; border:1px solid #3a5a3a; color:#bcd8bc; }
  .result.err { background:#2a161650; border:1px solid #5a3a3a; color:#e0b0b0; }
  .result code, code { color:var(--accent); word-break:break-all; }

  /* Manage list */
  #list { display:flex; flex-direction:column; gap:12px; }
  .tile-row { display:grid; grid-template-columns:84px 1fr; gap:14px; padding:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:4px; }
  .tile-row.hidden-row { opacity:.55; }
  .thumb { width:84px; height:84px; border-radius:3px; object-fit:cover; background:#000;
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .meta { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .meta .type-badge { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
    border:1px solid rgba(200,169,110,.4); border-radius:2px; padding:1px 6px; width:fit-content; }
  .meta input, .meta textarea { font-size:12px; padding:7px 9px; }
  .meta .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .meta button { font-family:inherit; font-size:11px; letter-spacing:.06em; padding:7px 12px;
    border-radius:3px; cursor:pointer; border:1px solid var(--border); background:#1d1b16; color:var(--text); }
  .meta button.save { border-color:var(--accent); color:var(--accent); }
  .meta button.del { border-color:#5a3a3a; color:#e0b0b0; }
  .meta button:hover { filter:brightness(1.15); }
  .empty { color:var(--muted); font-size:13px; padding:20px 0; }
</style>
</head>
<body>
<main>
  <h1>Admin</h1>
  <p class="sub">Manage the gallery · view:
    <a href="/">local →</a> ·
    <a href="http://git.marcuschiu.com/images/" target="_blank" rel="noopener">production →</a></p>

  <div class="tabs">
    <button id="tab-add" class="active" onclick="switchTab('add')">Add tile</button>
    <button id="tab-manage" onclick="switchTab('manage')">Manage tiles</button>
  </div>

  <!-- ── ADD ── -->
  <section id="panel-add" class="panel on">
    <form id="form">
      <div class="field">
        <span class="lbl">Type</span>
        <div class="seg" id="typeSeg">
          <label><input type="radio" name="type" value="image" checked>Image</label>
          <label><input type="radio" name="type" value="youtube">YouTube</label>
          <label><input type="radio" name="type" value="video">Video</label>
        </div>
      </div>

      <!-- image -->
      <div class="field typed on" data-for="image">
        <span class="lbl">Image source</span>
        <div class="seg" id="srcSeg">
          <label><input type="radio" name="imgsrc" value="upload" checked>Upload file</label>
          <label><input type="radio" name="imgsrc" value="url">From URL</label>
        </div>
      </div>
      <label class="field srcd on" data-src="upload" data-for="image">
        <span class="lbl">Image file</span>
        <input type="file" name="media" accept="image/*">
      </label>
      <label class="field srcd" data-src="url" data-for="image">
        <span class="lbl">Image URL <span class="hint">(downloaded &amp; saved locally)</span></span>
        <input type="url" name="imageUrl" placeholder="https://example.com/photo.jpg">
      </label>

      <!-- youtube -->
      <label class="field typed" data-for="youtube">
        <span class="lbl">YouTube URL or ID</span>
        <input type="text" name="youtube" placeholder="https://youtu.be/aqz-KE-bpKQ  ·  or  ·  aqz-KE-bpKQ">
      </label>

      <!-- video -->
      <label class="field typed" data-for="video">
        <span class="lbl">Video file</span>
        <input type="file" name="media2" accept="video/*">
      </label>
      <label class="field typed" data-for="video">
        <span class="lbl">Poster image <span class="hint">(optional — the video's first frame is used if left blank)</span></span>
        <input type="file" name="poster" accept="image/*">
      </label>

      <label class="field">
        <span class="lbl">Description <span class="hint">(optional)</span></span>
        <textarea name="desc" placeholder="Shown on hover and in the lightbox."></textarea>
      </label>
      <label class="field">
        <span class="lbl">External link <span class="hint">(optional)</span></span>
        <input type="url" name="link" placeholder="https://example.com">
      </label>
      <label class="check"><input type="checkbox" name="hidden"> Add as hidden</label>

      <button class="primary" id="submit" type="submit">Add tile</button>
      <div id="result" class="result"></div>
    </form>
  </section>

  <!-- ── MANAGE ── -->
  <section id="panel-manage" class="panel">
    <div id="list"><p class="empty">Loading…</p></div>
  </section>
</main>

<script>
  const $ = (s, r = document) => r.querySelector(s);
  const PROD_URL = 'http://git.marcuschiu.com/images/';

  /* ── Tabs ── */
  function switchTab(name) {
    $('#tab-add').classList.toggle('active', name === 'add');
    $('#tab-manage').classList.toggle('active', name === 'manage');
    $('#panel-add').classList.toggle('on', name === 'add');
    $('#panel-manage').classList.toggle('on', name === 'manage');
    if (name === 'manage') loadList();
  }

  /* ── Add form: conditional fields ── */
  const form = $('#form');
  function syncType() {
    const type = form.querySelector('input[name=type]:checked').value;
    document.querySelectorAll('.field.typed').forEach(el => el.classList.toggle('on', el.dataset.for === type));
    if (type === 'image') syncSrc(); // re-evaluate src sub-fields
  }
  function syncSrc() {
    const src = form.querySelector('input[name=imgsrc]:checked').value;
    document.querySelectorAll('.field.srcd').forEach(el => el.classList.toggle('on', el.dataset.src === src));
  }
  form.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', syncType));
  form.querySelectorAll('input[name=imgsrc]').forEach(r => r.addEventListener('change', syncSrc));

  function showResult(ok, html) {
    const r = $('#result');
    r.className = 'result show ' + (ok ? 'ok' : 'err');
    r.innerHTML = html;
  }

  /* Grab the first frame of a video file as a JPEG blob (browser-side decode). */
  function extractFirstFrame(file) {
    return new Promise((resolve) => {
      const video = document.createElement('video');
      video.muted = true; video.playsInline = true; video.preload = 'auto';
      const url = URL.createObjectURL(file);
      let done = false;
      const finish = (blob) => { if (!done) { done = true; URL.revokeObjectURL(url); resolve(blob); } };
      const capture = () => {
        const w = video.videoWidth, h = video.videoHeight;
        if (!w || !h) return finish(null);
        try {
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(video, 0, 0, w, h);
          canvas.toBlob((b) => finish(b), 'image/jpeg', 0.9);
        } catch { finish(null); }
      };
      video.onloadeddata = () => {
        // Nudge past the very start so a frame is guaranteed to be decoded.
        try { video.currentTime = Math.min(0.1, (video.duration || 1) / 2); }
        catch { capture(); }
      };
      video.onseeked = capture;
      video.onerror = () => finish(null);
      video.src = url;
      setTimeout(() => finish(null), 8000); // give up gracefully
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const type = form.querySelector('input[name=type]:checked').value;
    const fd = new FormData();
    fd.append('type', type);
    fd.append('desc', form.desc.value);
    fd.append('link', form.link.value);
    if (form.hidden.checked) fd.append('hidden', 'true');

    if (type === 'image') {
      const src = form.querySelector('input[name=imgsrc]:checked').value;
      if (src === 'upload') {
        if (!form.media.files[0]) return showResult(false, 'Choose an image file.');
        fd.append('media', form.media.files[0]);
      } else {
        if (!form.imageUrl.value.trim()) return showResult(false, 'Paste an image URL.');
        fd.append('imageUrl', form.imageUrl.value.trim());
      }
    } else if (type === 'video') {
      if (!form.media2.files[0]) return showResult(false, 'Choose a video file.');
      fd.append('media', form.media2.files[0]);
      if (form.poster.files[0]) {
        fd.append('poster', form.poster.files[0]);
      } else {
        // No poster given — grab the video's first frame in the browser.
        const sbtn = $('#submit');
        sbtn.disabled = true; sbtn.textContent = 'Reading first frame…';
        const frame = await extractFirstFrame(form.media2.files[0]);
        if (frame) fd.append('poster', frame, 'poster.jpg');
      }
    } else {
      if (!form.youtube.value.trim()) return showResult(false, 'Paste a YouTube URL or ID.');
      fd.append('youtube', form.youtube.value.trim());
    }

    const btn = $('#submit');
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      const res = await fetch('/api/tiles', { method: 'POST', body: fd });
      const data = await res.json();
      if (res.ok) {
        const what = data.entry.file ? `<code>${data.entry.file}</code>` : `id <code>${data.entry.id}</code>`;
        showResult(true, `Added ${data.entry.type} ${what} · dated <code>${data.entry.date}</code>` +
          (data.entry.hidden ? ' · <em>hidden</em>' : '') + gitNote(data.git) +
          ` · view: <a href="/">local →</a> · <a href="${PROD_URL}" target="_blank" rel="noopener">production →</a>`);
        form.reset(); syncType();
      } else showResult(false, data.error || 'Something went wrong.');
    } catch (err) { showResult(false, String(err)); }
    finally { btn.disabled = false; btn.textContent = 'Add tile'; }
  });

  /* ── Manage list ── */
  const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mediaUrl = (f) => 'content/media/' + encodeURIComponent(f);

  /* Render the auto commit+push outcome inline. */
  function gitNote(g) {
    if (!g) return '';
    if (g.pushed) return ' · <span style="color:var(--accent)">pushed to GitHub ✓</span>';
    if (g.reason) return ` · <span class="hint">git: ${esc(g.reason)}</span>`;
    if (g.error)  return ` · <span style="color:#e0b0b0">push failed: ${esc(g.error)}</span>`;
    return '';
  }
  function gitAlert(g) {
    if (g && g.error) alert('Saved, but git push failed:\n' + g.error);
  }

  function thumbHTML(it) {
    if (it.type === 'youtube') return `<img src="https://img.youtube.com/vi/${esc(it.id)}/default.jpg" alt="">`;
    if (it.type === 'image')   return `<img src="${esc(mediaUrl(it.file))}" alt="">`;
    if (it.poster)             return `<img src="${esc(mediaUrl(it.poster))}" alt="">`;
    return 'video';
  }

  async function loadList() {
    const box = $('#list');
    box.innerHTML = '<p class="empty">Loading…</p>';
    let items;
    try { items = (await (await fetch('/api/tiles')).json()).items; }
    catch (e) { box.innerHTML = `<p class="empty">Failed to load: ${esc(e)}</p>`; return; }
    if (!items.length) { box.innerHTML = '<p class="empty">No tiles yet.</p>'; return; }

    box.innerHTML = '';
    items.forEach((it) => {
      const row = document.createElement('div');
      row.className = 'tile-row' + (it.hidden ? ' hidden-row' : '');
      row.innerHTML = `
        <div class="thumb">${thumbHTML(it)}</div>
        <div class="meta">
          <span class="type-badge">${esc(it.type)}${it.hidden ? ' · hidden' : ''}</span>
          <input class="f-date" type="text" value="${esc(it.date)}" spellcheck="false">
          <textarea class="f-desc" placeholder="description">${esc(it.desc || '')}</textarea>
          <input class="f-link" type="url" value="${esc(it.link || '')}" placeholder="external link">
          <div class="controls">
            <label class="check"><input type="checkbox" class="f-hidden" ${it.hidden ? 'checked' : ''}> hidden</label>
            <button class="save">Save</button>
            <button class="del">Delete</button>
          </div>
        </div>`;
      const origDate = it.date;
      row.querySelector('.save').addEventListener('click', () => saveRow(row, origDate));
      row.querySelector('.del').addEventListener('click', () => delRow(origDate, it));
      box.appendChild(row);
    });
  }

  async function saveRow(row, origDate) {
    const payload = {
      date: origDate,
      newDate: row.querySelector('.f-date').value.trim(),
      desc: row.querySelector('.f-desc').value,
      link: row.querySelector('.f-link').value,
      hidden: row.querySelector('.f-hidden').checked,
    };
    const btn = row.querySelector('.save');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch('/api/tiles/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Update failed'); }
      else gitAlert(data.git);
      await loadList();
    } catch (e) { alert(String(e)); btn.disabled = false; btn.textContent = 'Save'; }
  }

  async function delRow(date, it) {
    const label = it.desc ? `“${it.desc.slice(0, 40)}”` : (it.file || it.id || date);
    if (!confirm(`Delete this ${it.type} tile (${label})?\nIts media files will also be removed.`)) return;
    try {
      const res = await fetch('/api/tiles/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date }),
      });
      const data = await res.json();
      if (!res.ok) alert(data.error || 'Delete failed');
      else gitAlert(data.git);
      await loadList();
    } catch (e) { alert(String(e)); }
  }

  syncType();
</script>
</body>
</html>

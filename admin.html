<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  /* Modal-form internals only — the gallery chrome comes from styles.css, and the
     overlay / floating button live in styles.css's admin block. */
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap');

  .admin-form { display:flex; flex-direction:column; gap:22px; }
  .admin-form label { display:flex; flex-direction:column; gap:8px; }
  .admin-form label[hidden] { display:none; }
  .admin-form label > span { font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }
  .admin-form label > span em { font-style:normal; color:var(--accent); opacity:0.7; margin-left:6px; }

  .admin-form input[type=text], .admin-form input[type=url], .admin-form textarea {
    width:100%; padding:12px 14px; background:transparent; border:1px solid var(--border);
    border-radius:2px; color:var(--text); font-family:'DM Mono',monospace; font-size:13px;
    letter-spacing:0.04em; outline:none; transition:border-color .2s; }
  .admin-form textarea { resize:vertical; line-height:1.6; }
  .admin-form input:focus, .admin-form textarea:focus { border-color:var(--accent); }
  .admin-form input::placeholder, .admin-form textarea::placeholder { color:var(--muted); }

  input[type=file] { width:100%; padding:10px 12px; background:transparent; border:1px solid var(--border);
    border-radius:2px; color:var(--text); font-family:'DM Mono',monospace; font-size:12px; cursor:pointer; }
  input[type=file]::file-selector-button { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.16em;
    text-transform:uppercase; padding:6px 12px; margin-right:12px; background:transparent;
    border:1px solid var(--border); border-radius:2px; color:var(--text); cursor:pointer; }
  input[type=file]::file-selector-button:hover { border-color:var(--accent); }

  .seg { display:flex; gap:8px; }
  .seg-btn { flex:1; text-align:center; font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.18em;
    text-transform:uppercase; padding:11px 8px; background:transparent; border:1px solid var(--border);
    border-radius:2px; color:var(--muted); cursor:pointer; transition:border-color .2s,color .2s; }
  .seg-btn input { display:none; }
  .seg-btn:has(input:checked) { color:var(--accent); border-color:var(--accent); }

  .admin-form label.check-row { flex-direction:row; align-items:center; gap:11px; cursor:pointer; }
  .check-row input { flex-shrink:0; width:15px; height:15px; accent-color:var(--accent); }
  .check-row > span { color:var(--muted); }

  .form-actions { display:flex; gap:14px; margin-top:4px; flex-wrap:wrap; }

  .btn { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.18em; text-transform:uppercase;
    padding:11px 20px; border-radius:2px; border:1px solid var(--border); background:transparent;
    color:var(--text); cursor:pointer; transition:border-color .2s,color .2s; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:0.5; cursor:default; }
  .btn-primary { border-color:var(--accent); color:var(--accent); }
  .btn-ghost { color:var(--muted); }
  .btn-danger:hover { border-color:#b4654a; color:#cf7a5d; }
  .form-actions .btn-danger { margin-left:auto; }

  .notice { font-size:10px; letter-spacing:0.12em; line-height:1.7; text-transform:uppercase;
    color:var(--accent); }
  .notice a { color:var(--accent); }
  .notice code { color:var(--text); text-transform:none; letter-spacing:0; }
  .notice-error { color:#cf7a5d; }

  .edit-file { display:flex; flex-direction:column; gap:6px; }
  .edit-file > span { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
  .edit-thumb { width:74px; height:74px; border:1px solid var(--border); border-radius:2px; object-fit:cover;
    background:#000; }
</style>
</head>
<body>

<div id="shell">
  <div id="gallery-wrap">

    <!-- TOOLBAR — same chrome as index.html; admin.js gets a "Show hidden" row -->
    <div id="toolbar">
      <div class="tb-search">
        <span class="tb-search-icon">⌕</span>
        <input id="gallery-search" type="text" placeholder="Search title, words, type…" autocomplete="off" spellcheck="false" data-hov>
      </div>
      <div id="filter-dd" class="tb-dd">
        <button id="filter-btn" class="tb-btn" data-hov>
          <span class="tb-key">FILTER</span> <span id="filter-label">ALL</span> <span id="filter-caret" class="tb-caret">⌄</span>
        </button>
        <div id="filter-panel" class="tb-panel">
          <div class="tb-panel-head">Show types</div>
        </div>
      </div>
      <button id="sort-btn" class="tb-btn" data-hov>
        <span class="tb-key">SORT</span> <span id="sort-label">Newest</span> <span id="sort-icon" class="tb-caret">↓</span>
      </button>
      <span id="result-count" class="tb-count">SHOWING 0 / 0</span>
    </div>

    <!-- GALLERY — owned by script.js (admin mode) -->
    <div id="mosaic"></div>
    <div id="sentinel">Loading…</div>

    <div class="end-space" aria-hidden="true"></div>

    <footer id="site-footer">
      <div class="foot-brand">
        <div class="foot-mark">Admin<span>.</span></div>
        <div class="foot-meta">© 2026 Marcus Chiu</div>
      </div>
      <a id="to-top" href="/index" data-hov>VIEW LOCAL →</a>
    </footer>

  </div>
</div>

<!-- Floating create button; admin.js opens the add-tile modal -->
<button id="admin-create" type="button" aria-label="Create a tile">+</button>

<!-- Modal host; admin.js fills it with the create / edit forms -->
<div id="admin-modal" class="admin-modal" hidden></div>

<script>window.GALLERY_CONFIG = { admin: true };</script>
<script src="script.js"></script>
<script src="admin.js"></script>
</body>
</html>

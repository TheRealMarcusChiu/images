<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery Admin — Settings</title>
<style>
  :root { --bg:#0e0d0b; --text:#e8e0d0; --muted:#6b6456; --accent:#c8a96e; --border:#2a2720; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Mono',ui-monospace,monospace;
    min-height:100vh; display:flex; justify-content:center; padding:60px 24px; }
  main { width:100%; max-width:460px; }
  .eyebrow { font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  h1 { font-size:24px; font-weight:400; font-style:italic; font-family:Georgia,serif; margin-bottom:28px; }
  label { display:block; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  input { width:100%; padding:12px 14px; background:transparent; border:1px solid var(--border); border-radius:2px;
    color:var(--text); font-family:inherit; font-size:13px; outline:none; }
  input:focus { border-color:var(--accent); }
  .hint { font-size:10px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .row { display:flex; gap:12px; align-items:center; margin-top:20px; }
  button { font-family:inherit; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; padding:11px 20px;
    border-radius:2px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #saved { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); opacity:0; transition:opacity .2s; }
  #saved.show { opacity:1; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Mosaic Gallery Admin</p>
  <h1>Settings</h1>
  <label for="url">Server URL</label>
  <input id="url" type="url" placeholder="http://localhost:3000" spellcheck="false">
  <p class="hint">Base URL of your gallery server. The admin server defaults to
    <code>http://localhost:3000</code>. No trailing slash needed.</p>
  <div class="row">
    <button id="save">Save</button>
    <span id="saved">Saved ✓</span>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery Admin</title>
<style>
  :root { --bg:#0e0d0b; --text:#e8e0d0; --muted:#6b6456; --accent:#c8a96e; --border:#2a2720; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--text); font-family:'DM Mono',ui-monospace,monospace; }
  body { width:440px; min-height:320px; }

  header { text-align:center; padding:22px 20px 14px; }
  .eyebrow { font-size:8px; letter-spacing:0.24em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  h1 { font-size:20px; font-weight:400; letter-spacing:0.02em; font-style:italic; font-family:Georgia,serif; }

  .tabs { display:flex; gap:8px; justify-content:center; margin-top:16px; }
  .tab { font-family:inherit; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; padding:8px 18px;
    background:transparent; border:1px solid var(--border); border-radius:2px; color:var(--muted); cursor:pointer;
    transition:border-color .2s,color .2s; }
  .tab:hover { color:var(--text); }
  .tab.is-active { color:var(--accent); border-color:var(--accent); }

  main { padding:6px 20px 14px; }
  .panel { animation:fade .25s ease both; }
  @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  form { display:flex; flex-direction:column; gap:15px; }
  label { display:flex; flex-direction:column; gap:6px; }
  label[hidden] { display:none; }
  label > span { font-size:8px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
  label > span em { font-style:normal; color:var(--accent); opacity:0.7; margin-left:5px; }

  input[type=text], input[type=url], textarea {
    width:100%; padding:9px 11px; background:transparent; border:1px solid var(--border); border-radius:2px;
    color:var(--text); font-family:inherit; font-size:12px; outline:none; transition:border-color .2s; }
  textarea { resize:vertical; min-height:48px; line-height:1.5; }
  input:focus, textarea:focus { border-color:var(--accent); }
  input::placeholder, textarea::placeholder { color:var(--muted); }
  input[type=file] { font-family:inherit; font-size:11px; color:var(--text); }

  .seg { display:flex; gap:7px; }
  .seg-btn { flex:1; text-align:center; font-family:inherit; font-size:9px; letter-spacing:0.16em; text-transform:uppercase;
    padding:9px 6px; background:transparent; border:1px solid var(--border); border-radius:2px; color:var(--muted);
    cursor:pointer; transition:border-color .2s,color .2s; }
  .seg-btn input { display:none; }
  .seg-btn:has(input:checked) { color:var(--accent); border-color:var(--accent); }

  .check-row { flex-direction:row; align-items:center; gap:9px; cursor:pointer; }
  .check-row input { width:14px; height:14px; accent-color:var(--accent); flex-shrink:0; }
  .check-row > span { color:var(--muted); }

  .actions { display:flex; gap:10px; margin-top:2px; }
  .btn { font-family:inherit; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; padding:10px 16px;
    border-radius:2px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer;
    transition:border-color .2s,color .2s; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:0.5; cursor:default; }
  .btn-primary { border-color:var(--accent); color:var(--accent); }
  .btn-ghost { color:var(--muted); }
  .btn-danger:hover { border-color:#b4654a; color:#cf7a5d; }

  .notice { font-size:9px; letter-spacing:0.08em; line-height:1.6; text-transform:uppercase; color:var(--accent); }
  .notice a { color:var(--accent); }
  .notice code { color:var(--text); text-transform:none; letter-spacing:0; word-break:break-all; }
  .notice-error { color:#cf7a5d; }

  .count { font-size:8px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .manage-list { display:flex; flex-direction:column; max-height:360px; overflow-y:auto; }
  .row { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
  .row:first-child { border-top:1px solid var(--border); }
  .row.is-hidden { opacity:0.5; }
  .thumb { width:46px; height:46px; flex-shrink:0; border:1px solid var(--border); border-radius:2px; background:#000;
    object-fit:cover; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:7px;
    text-transform:uppercase; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .body { flex:1; min-width:0; }
  .body .t { font-style:italic; font-family:Georgia,serif; font-size:12px; line-height:1.4; overflow-wrap:anywhere; }
  .body .t .muted { font-family:inherit; font-style:normal; font-size:10px; color:var(--muted); }
  .body .m { margin-top:5px; font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); }
  .row-actions { display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
  .row-actions .btn { padding:6px 9px; font-size:8px; }
  .edit-fields { display:flex; flex-direction:column; gap:7px; }
  .edit-fields input, .edit-fields textarea { font-size:11px; padding:7px 9px; }
  .edit-check { flex-direction:row; align-items:center; gap:8px; font-size:8px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--muted); cursor:pointer; }
  .edit-check input { width:13px; height:13px; accent-color:var(--accent); }
  .empty { text-align:center; padding:30px 10px; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }

  footer { padding:12px 20px 16px; border-top:1px solid var(--border); font-size:8px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  footer #server { color:var(--text); text-transform:none; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer a { color:var(--accent); text-decoration:none; cursor:pointer; flex-shrink:0; }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Mosaic Gallery</p>
  <h1>Admin</h1>
  <nav class="tabs">
    <button class="tab is-active" data-tab="add">Add</button>
    <button class="tab" data-tab="manage">Manage</button>
  </nav>
</header>

<main>
  <!-- Add -->
  <section class="panel" data-panel="add">
    <form id="add-form" autocomplete="off">
      <label>
        <span>Type <em>required</em></span>
        <div class="seg">
          <label class="seg-btn"><input type="radio" name="type" value="image" checked>Image</label>
          <label class="seg-btn"><input type="radio" name="type" value="youtube">YouTube</label>
          <label class="seg-btn"><input type="radio" name="type" value="video">Video</label>
        </div>
      </label>

      <label class="typed" data-for="image">
        <span>Image source</span>
        <div class="seg">
          <label class="seg-btn"><input type="radio" name="imgsrc" value="url" checked>From URL</label>
          <label class="seg-btn"><input type="radio" name="imgsrc" value="upload">Upload file</label>
        </div>
      </label>
      <label class="typed srcd" data-for="image" data-src="url">
        <span>Image URL <em>downloaded &amp; saved</em></span>
        <input type="url" name="imageUrl" placeholder="https://example.com/photo.jpg">
      </label>
      <label class="typed srcd" data-for="image" data-src="upload" hidden>
        <span>Image file</span>
        <input type="file" name="media" accept="image/*">
      </label>

      <label class="typed" data-for="youtube" hidden>
        <span>YouTube URL or ID</span>
        <input type="text" name="youtube" placeholder="https://youtu.be/aqz-KE-bpKQ">
      </label>

      <label class="typed" data-for="video" hidden>
        <span>Video file</span>
        <input type="file" name="media2" accept="video/*">
      </label>
      <label class="typed" data-for="video" hidden>
        <span>Poster <em>optional · first frame used if blank</em></span>
        <input type="file" name="poster" accept="image/*">
      </label>

      <label>
        <span>Description <em>optional</em></span>
        <textarea name="desc" rows="2" placeholder="Shown on hover / in the lightbox."></textarea>
      </label>
      <label>
        <span>External link <em>optional</em></span>
        <input type="url" name="link" placeholder="https://example.com">
      </label>
      <label class="check-row"><input type="checkbox" name="hidden"><span>Add as hidden</span></label>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Add tile</button>
        <button type="reset" class="btn btn-ghost">Clear</button>
      </div>
      <p id="notice" class="notice" hidden></p>
    </form>
  </section>

  <!-- Manage -->
  <section class="panel" data-panel="manage" hidden>
    <p id="count" class="count"></p>
    <div id="rows" class="manage-list"></div>
    <p id="empty" class="empty" hidden>No tiles yet.</p>
  </section>
</main>

<footer>
  <span>server: <span id="server">…</span></span>
  <a id="open-options">change</a>
</footer>

<script src="popup.js"></script>
</body>
</html>

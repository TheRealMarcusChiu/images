<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosaic Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0e0d0b;
    --surface: #161512;
    --border: #2a2720;
    --text: #e8e0d0;
    --muted: #6b6456;
    --accent: #c8a96e;
    --gap: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }

  #shell { display: flex; height: 100vh; width: 100vw; }

  /* ── Gallery ── */
  #gallery-wrap {
    flex: 1;
    overflow-y: scroll;
    overflow-x: hidden;
  }
  #gallery-wrap::-webkit-scrollbar { width: 4px; }
  #gallery-wrap::-webkit-scrollbar-track { background: transparent; }
  #gallery-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #mosaic {
    column-count: 4;
    column-gap: var(--gap);
    padding: var(--gap);
  }
  @media (max-width: 1100px) { #mosaic { column-count: 3; } }
  @media (max-width: 720px)  { #mosaic { column-count: 2; } }

  /* ── Tile (shared) ── */
  .tile {
    break-inside: avoid;
    margin-bottom: var(--gap);
    position: relative;
    overflow: hidden;
    border-radius: 3px;
    display: block;
    background: var(--surface);
  }

  /* ── Image tile ── */
  .tile > img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.4s ease;
    filter: saturate(0.82) brightness(0.9);
  }
  .tile:hover > img {
    transform: scale(1.04);
    filter: saturate(1.1) brightness(1.0);
  }

  /* ── Link badge (top-right corner) ── */
  .link-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(14, 13, 11, 0.72);
    border: 1px solid rgba(200, 169, 110, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none; /* tile click handles navigation */
  }
  .link-badge svg {
    width: 12px;
    height: 12px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tile.has-link .link-badge {
    opacity: 1;
    transform: scale(1);
  }
  /* subtle border glow for linked tiles */
  .tile.has-link {
    cursor: pointer;
  }
  .tile.has-link::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(200, 169, 110, 0);
    transition: box-shadow 0.3s ease;
    pointer-events: none;
    z-index: 6;
  }
  .tile.has-link:hover::after {
    box-shadow: inset 0 0 0 1.5px rgba(200, 169, 110, 0.45);
  }

  /* ── Video tile ── */
  .video-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: #000;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(200,169,110,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 4;
  }
  .play-badge svg { width: 18px; height: 18px; fill: #0e0d0b; margin-left: 2px; stroke: none; }
  .tile.video-tile:hover .play-badge { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
  .video-cover {
    position: absolute;
    inset: 0;
    cursor: pointer;
    z-index: 3;
    transition: opacity 0.3s ease;
  }
  .video-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.75) saturate(0.8);
    transition: filter 0.3s ease;
  }
  .video-cover:hover img { filter: brightness(0.55) saturate(0.9); }

  /* ── Shared hover overlay (metadata) ── */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(10, 9, 7, 0.93) 0%,
      rgba(10, 9, 7, 0.3) 40%,
      transparent 65%
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px 12px 12px;
    pointer-events: none;
    z-index: 5;
  }
  .tile:hover .overlay { opacity: 1; }
  .overlay .ts {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .overlay .desc {
    font-size: 11px;
    line-height: 1.55;
    color: var(--text);
    font-weight: 300;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .overlay .media-type {
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(200,169,110,0.4);
    border-radius: 2px;
    padding: 1px 5px;
    display: inline-block;
    margin-bottom: 5px;
    width: fit-content;
  }

  /* ── Sentinel ── */
  #sentinel {
    text-align: center;
    padding: 24px;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tile { animation: fadeUp 0.4s ease both; }
</style>
</head>
<body>
<div id="shell">
  <div id="gallery-wrap">
    <div id="mosaic"></div>
    <div id="sentinel">Loading…</div>
  </div>
</div>

<script>
const DESCRIPTIONS = [
  "Golden hour catches the dust suspended mid-air in the empty warehouse.",
  "First frost of the season traced along the windowpane.",
  "Market day, the usual chaos, an unusual calm at its center.",
  "She had been sitting there for hours before I noticed.",
  "The light changed and everyone looked up at once.",
  "Rain-slicked cobblestones, a single red umbrella.",
  "Scaffolding came down that morning. The building blinked in the sun.",
  "Three dogs, zero humans, one very suspicious tennis ball.",
  "Long exposure of the ferry crossing — the water became silk.",
  "Overheard: that's the last time I trust a map drawn from memory.",
  "A brief window between the clouds, then gone.",
  "The cat had claimed the entire kitchen as sovereign territory.",
  "Storm light over the reservoir just before the rain arrived.",
  "Nobody told the sunflowers summer was nearly over.",
  null, null, null, null, null, null
];

// Sample external links — roughly 1 in 3 image tiles will get one
const SAMPLE_LINKS = [
  'https://unsplash.com',
  'https://www.nationalgeographic.com',
  'https://www.lensculture.com',
  'https://500px.com',
  'https://www.magnumphotos.com',
  'https://www.worldpressphoto.org',
  null, null, null, // more nulls = fewer linked tiles
];

const YOUTUBE_IDS = [
  { id: 'aqz-KE-bpKQ', title: 'Big Buck Bunny' },
  { id: 'YE7VzlLtp-4', title: 'Elephants Dream' },
  { id: 'TKNjNatvOuA', title: 'Tears of Steel' },
  { id: 'eRsGyueVLvQ', title: 'Cosmos Laundromat' },
  { id: 'ly36kn0ug4k', title: 'Glass Half' },
  { id: 'WhWc3b3KhnY', title: 'Sintel' },
  { id: 'mN0zPOpADL4', title: 'CHARGE!' },
  { id: 'RR36BkHqAbo', title: 'Caminandes: Gran Desierto' },
  { id: 'otiHE9D3dAI', title: 'Caminandes: Llamigos' },
  { id: 'KK9bwTlAvgo', title: 'The Daily Dweebs' },
];

const IMG_SIZES = [
  [400,500],[400,300],[400,600],[400,350],[400,450],
  [400,280],[400,520],[400,380],[400,460],[400,320],
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function makeTS(year) {
  const mm = String(Math.floor(Math.random()*12)+1).padStart(2,'0');
  const dd = String(Math.floor(Math.random()*28)+1).padStart(2,'0');
  const hh = String(Math.floor(Math.random()*24)).padStart(2,'0');
  const mn = String(Math.floor(Math.random()*60)).padStart(2,'0');
  return `${year}.${mm}.${dd} ${hh}:${mn}`;
}

// External-link SVG icon (arrow-up-right style)
const LINK_ICON_SVG = `
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    <polyline points="15 3 21 3 21 9"/>
    <line x1="10" y1="14" x2="21" y2="3"/>
  </svg>`;

let currentYear = 2024;
const MIN_YEAR  = 2010;
let loading     = false;
let imgSeed     = 20;
let ytIndex     = 0;

const mosaic   = document.getElementById('mosaic');
const sentinel = document.getElementById('sentinel');
const galWrap  = document.getElementById('gallery-wrap');

/* ── Scroll position persistence via sessionStorage ── */
// Save scroll position continuously
galWrap.addEventListener('scroll', () => {
  sessionStorage.setItem('gallery-scroll', galWrap.scrollTop);
}, { passive: true });

/* ── Image tile ── */
function makeImageTile(year, i) {
  const [w, h] = pick(IMG_SIZES);
  const desc   = pick(DESCRIPTIONS);
  const ts     = makeTS(year);
  const s      = imgSeed++;
  const link   = pick(SAMPLE_LINKS);

  const tile = document.createElement('div');
  tile.className = 'tile' + (link ? ' has-link' : '');
  tile.style.animationDelay = `${(i % 5) * 55}ms`;

  tile.innerHTML = `
    <img src="https://picsum.photos/seed/${s}/${w}/${h}"
         width="${w}" height="${h}" alt="${desc || 'photo'}">
    ${link ? `<div class="link-badge">${LINK_ICON_SVG}</div>` : ''}
    <div class="overlay">
      <div class="ts">${ts}</div>
      ${desc ? `<div class="desc">${desc}</div>` : ''}
    </div>`;

  if (link) {
    tile.addEventListener('click', () => {
      // scroll position already saved by the scroll listener
      window.open(link, '_blank');
    });
  }

  return tile;
}

/* ── Video tile ── */
function makeVideoTile(year, i) {
  const yt       = YOUTUBE_IDS[ytIndex++ % YOUTUBE_IDS.length];
  const desc     = pick(DESCRIPTIONS);
  const ts       = makeTS(year);
  const thumbUrl = `https://img.youtube.com/vi/${yt.id}/mqdefault.jpg`;

  const tile = document.createElement('div');
  tile.className = 'tile video-tile';
  tile.style.animationDelay = `${(i % 5) * 55}ms`;

  tile.innerHTML = `
    <div class="video-wrap">
      <iframe
        data-src="https://www.youtube.com/embed/${yt.id}?autoplay=1&rel=0"
        title="${yt.title}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div class="video-cover">
        <img src="${thumbUrl}" alt="${yt.title}">
      </div>
      <div class="play-badge">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </div>
    </div>
    <div class="overlay">
      <div class="ts">${ts}</div>
      <div class="media-type">video</div>
      ${desc ? `<div class="desc">${desc}</div>` : ''}
    </div>`;

  const cover  = tile.querySelector('.video-cover');
  const badge  = tile.querySelector('.play-badge');
  const iframe = tile.querySelector('iframe');
  cover.addEventListener('click', () => {
    iframe.src = iframe.dataset.src;
    cover.style.opacity = '0';
    cover.style.pointerEvents = 'none';
    badge.style.display = 'none';
  });

  return tile;
}

/* ── Build a batch ── */
function buildBatch(year) {
  const count = 9 + Math.floor(Math.random() * 7);
  for (let i = 0; i < count; i++) {
    const isVideo = Math.random() < 0.25;
    mosaic.appendChild(isVideo ? makeVideoTile(year, i) : makeImageTile(year, i));
  }
}

/* ── Infinite scroll ── */
function loadMore() {
  if (loading || currentYear < MIN_YEAR) return;
  loading = true;
  sentinel.textContent = `Loading ${currentYear}…`;
  setTimeout(() => {
    buildBatch(currentYear--);
    loading = false;
    if (currentYear < MIN_YEAR) {
      sentinel.textContent = '— end of archive —';
      sentinel.style.opacity = '0.3';
      observer.disconnect();
    } else {
      sentinel.textContent = 'Loading…';
    }
    // After first batch check if we need to restore saved scroll
    restoreScroll();
  }, 80);
}

/* ── Restore scroll position on page load (back navigation) ── */
let scrollRestored = false;
function restoreScroll() {
  if (scrollRestored) return;
  const saved = sessionStorage.getItem('gallery-scroll');
  if (!saved) return;
  const target = parseInt(saved, 10);
  // Only restore if enough content has been loaded to reach that position
  if (galWrap.scrollHeight >= target + galWrap.clientHeight) {
    galWrap.scrollTop = target;
    scrollRestored = true;
  }
}

const observer = new IntersectionObserver(
  e => { if (e[0].isIntersecting) loadMore(); },
  { root: galWrap, threshold: 0.1 }
);
observer.observe(sentinel);

loadMore();
setTimeout(loadMore, 250);
</script>
</body>
</html>
